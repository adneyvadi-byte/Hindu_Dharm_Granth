<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sant Sahitya Library</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header>
        <h1>📚 Sant Sahitya Library</h1>
        <p>Read Sant Literature Online for Free</p>
    </header>

    <!-- Search -->
    <section class="search-section">
        <input type="text" id="searchInput" placeholder="Search books...">
    </section>

    <!-- Categories -->
    <section class="categories">
        <button class="category active">All</button>
        <button class="category">Sant Sahitya</button>
        <button class="category">Bhagavad Gita</button>
        <button class="category">Upanishads</button>
        <button class="category">Ramayana</button>
        <button class="category">Mahabharata</button>
    </section>

    <!-- Books -->
    <main>

        <div id="bookContainer" class="book-container">
            <!-- Books will appear here automatically -->
        </div>

    </main>

    <!-- Footer -->
    <footer>
        <p>© 2026 Sant Sahitya Library</p>
        <p>Made with ❤️ for Readers</p>
    </footer>

    <script src="books.js"></script>
    <script src="script.js"></script>

</body>
</html>
